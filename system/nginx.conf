# =====================================================
# KULZZY GATEWAY
# VERSION 1.0
# =====================================================

worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /run/nginx.pid;


# =====================================================
# EVENTS
# =====================================================

events {

    worker_connections 4096;

    multi_accept on;

}


# =====================================================
# HTTP
# =====================================================

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # -------------------------------------------------
    # PERFORMANCE
    # -------------------------------------------------

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    types_hash_max_size 2048;


    # -------------------------------------------------
    # SECURITY
    # -------------------------------------------------

    server_tokens off;


    # -------------------------------------------------
    # LOGGING
    # -------------------------------------------------

    access_log
        /var/log/nginx/access.log;


    # -------------------------------------------------
    # REQUEST SIZE
    # -------------------------------------------------

    client_max_body_size 500M;


    # -------------------------------------------------
    # API CONNECTION
    # -------------------------------------------------

    upstream kulzzy_api {

        server 127.0.0.1:5000;

        keepalive 32;

    }


    # =================================================
    # HTTP SERVER
    # =================================================

    server {

        listen 80;

        listen [::]:80;


        server_name

            kulzzyradio.com

            www.kulzzyradio.com;


        # -------------------------------------------------
        # KULZZY WEBSITE
        # -------------------------------------------------

        root /srv/kulzzy/web;

        index index.html;


        # -------------------------------------------------
        # WEBSITE ROUTING
        # -------------------------------------------------

        location / {

            try_files
                $uri
                $uri/
                /index.html;

        }


        # -------------------------------------------------
        # KULZZY API
        # -------------------------------------------------

        location /api/ {

            proxy_pass
                http://kulzzy_api;

            proxy_http_version 1.1;


            proxy_set_header
                Host
                $host;


            proxy_set_header
                X-Real-IP
                $remote_addr;


            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;


            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout
                30s;

            proxy_send_timeout
                300s;

            proxy_read_timeout
                300s;

        }


        # -------------------------------------------------
        # UPLOADS
        # -------------------------------------------------

        location /uploads/ {

            alias /kulzzy/uploads/;

            autoindex off;

        }


        # -------------------------------------------------
        # AUDIO
        # -------------------------------------------------

        location /audio/ {

            alias /kulzzy/audio/;

            autoindex off;

        }


        # -------------------------------------------------
        # CELEBRANTS
        # -------------------------------------------------

        location /celebrants/ {

            alias /kulzzy/celebrants/;

            autoindex off;

        }


        # -------------------------------------------------
        # SECURITY FILES
        # -------------------------------------------------

        location ~ /\. {

            deny all;

        }


        location ~* \.(env|ini|conf|key|pem|db|sqlite)$ {

            deny all;

        }


        # -------------------------------------------------
        # HEALTH
        # -------------------------------------------------

        location = /gateway-health {

            default_type
                application/json;

            return 200
                '{"success":true,"gateway":"kulzzy","status":"online"}';

        }

    }

}
